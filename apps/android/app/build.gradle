plugins {
    id 'com.android.application'
}

// Release signing comes from keystore.properties (gitignored), created by build-apk.bat.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.anasstudios.atlas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anasstudios.atlas'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        // Optional: bake your server in at build time with -PatlasServer=https://your-atlas.onrender.com
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${project.findProperty('atlasServer') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        // Release builds shouldn't fail on lint downloads in offline/CI environments.
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'androidx.annotation:annotation:1.9.1'
}
